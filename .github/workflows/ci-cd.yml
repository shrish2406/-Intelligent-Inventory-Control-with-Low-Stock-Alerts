
name: Smart Inventory CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        working-directory: Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Code
        run: python -m compileall -q Backend/app

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build React Application
        working-directory: Frontend
        run: npm run build

  docker:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t smart-inventory-backend ./Backend

      - name: Build Frontend Docker Image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=http://localhost:8000/api \
            -t smart-inventory-frontend ./Frontend

      - name: Pipeline Success
        run: echo "Smart Inventory CI/CD Pipeline completed successfully!"
